name: Deploy Frontend via FTP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📄 Making .env
        run: |
          cd frontend
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > .env

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite project
        working-directory: frontend
        run: npm run build

      - name: Copy .htaccess to build
        run: |
          if [ -f frontend/static/.htaccess ]; then
            cp frontend/static/.htaccess frontend/build/.htaccess
            echo "✅ .htaccess copied to build directory"
          else
            echo "⚠️ .htaccess not found in static/"
          fi

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/build/'

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./frontend/build/
          server-dir: /public_html/
          log-level: verbose
          dangerous-clean-slate: false
          dry-run: false
